[project]
name = "fingertip-finance-backend"
version = "0.1.0"
description = "Backend do Fingertip Finance: parsers, ledger, motor de cálculo e API."
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    # Crachá assinado do frontend (ADR 0004) e upload de arquivo
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    # Banco de dados (Postgres)
    "sqlalchemy==2.1.1",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    # Configuração (lê o .env)
    "pydantic-settings==2.15.0",
    # Dados e parsers (B3 xlsx, extratos Nomad em PDF)
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    # O openpyxl usa sozinho quando instalado: blinda o XML do xlsx (ADR 0004)
    "defusedxml==0.7.1",
    "pdfplumber==0.11.10",
    # Chamadas HTTP (API do Banco Central, Pluggy)
    "httpx==0.28.1",
]

# Ferramentas de desenvolvimento (não vão para o servidor)
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "pre-commit==4.6.2",
    "hypothesis==6.168.4",
]

[tool.uv]
# Não é um pacote publicável, só uma aplicação.
package = false

[tool.pytest.ini_options]
# Teste de volume fica fora da bateria normal: `uv run pytest -m slow -s`.
markers = ["slow: teste de volume (lento)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migrations são geradas: as listas de valores dos CHECKs ficam em uma linha só.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# A pasta backend/alembic/ (migrations) confunde o ruff, que acharia que o pacote
# alembic é nosso. Ele é uma dependência externa.
known-third-party = ["alembic"]
