# Verificações que rodam automaticamente antes de cada commit.
# Instalar uma vez: cd backend && uv run pre-commit install
repos:
  # Procura segredos (senhas, tokens, connection strings) no conteúdo dos arquivos.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Lint e formatação do Python (usa a config do backend/pyproject.toml).
  # Skills copiadas ficam idênticas à origem auditada: o ruff não mexe nelas.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: ["--fix"]
        exclude: ^\.claude/skills/
      - id: ruff-format
        exclude: ^\.claude/skills/
